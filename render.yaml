services:
  - type: web
    name: xml-flow-backend-saavedr4
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: TZ_HORARIO
        value: America/Mexico_City
      - key: HORA_INICIO
        value: "8"
      - key: HORA_FIN
        value: "19"
      - key: RESTRINGIR_HORARIO
        value: "true"
      - key: DATABASE_URL
        sync: false
